# Metabase, reading the serving copy of your warehouse. **Provided — don't change.**
#
#   docker compose up -d --build     (first build downloads ~700MB, be patient)
#   http://localhost:3000
#
# Two mounts:
#   ./data/serving  -> /serving        READ-ONLY. The gold tables, published by
#                                      the pipeline's publish step. Metabase reads
#                                      /serving/warehouse.duckdb (read-only ON).
#   ./data/metabase -> /metabase-data  Metabase's own app database (questions,
#                                      dashboards, users) so your work survives restarts.
#
# Why the serving copy and not data/warehouse.duckdb directly? DuckDB is
# single-writer: if Metabase held the live warehouse open, the next dbt rebuild
# couldn't get the lock. The pipeline publishes a separate copy for reading, so
# dbt and Metabase never touch the same file.
services:
  metabase:
    build: ./metabase
    container_name: week6-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./data/serving:/serving:ro
      - ./data/metabase:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
